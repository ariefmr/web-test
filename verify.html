  </head>
  <style>
    nav {
      background: #000;
    }
    .content {
      width: 100%;
      height: auto;
      color: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
    }
    h1 {
      font-family: 'Arial', sans-serif;
      font-size: 22px;
      color: #000;
      text-transform: uppercase;
      font-weight: 600;
      margin-top: 0px;
    }
    h2 {
      font-family: 'Arial', sans-serif;
      font-size: 16px;
      color: #000;
      margin-top: 5px;
    }
    /* Base layout cleanup */
    body {
      margin: 0;
    }
    nav.navbar {
      display: flex;
      align-items: center;
      padding: 20px 50px;
      gap: 16px;
    }
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .brand-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sad-block {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .brand-top img {
      max-width: 100%;
      max-height: 65px;
      width: auto;
    }
    .tagline {
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 11px;
      margin: 4px 0 0 0;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .logo {
      padding: 20px 50px;
      max-width: 100%;
      max-height: 38.5px;
    }

    /* Iframe defaults; JS will resize when possible */
    .doc-frame {
      width: 100%;
      border: none;
      height: 1200px
    }

    /* Tablet (portrait & small landscape) */
    @media (max-width: 1024px) {
      .logo {
        padding: 12px 24px;
        max-height: 38.5px;
      }
      h1 { font-size: 20px; }
      h2 { font-size: 15px; }
    }

    /* Mobile */
    @media (max-width: 600px) {
      nav.navbar {
        flex-direction: row;
        align-items: stretch;
        text-align: left;
      }
      .logo {
        padding: 10px 15px;
        max-height: 38.5px;
      }
      
      h1 { font-size: 14px; }
      h2 { font-size: 10px; }
      .doc-frame {
        height: 2700px
      }
    }

    /* Mobile iPhone SE*/
    @media (max-width: 375px) {
      h1 { font-size: 12px; }
      h2 { font-size: 8px; }
    }
    footer {
      background: #000;
      color: #fff;
      padding: 16px 50px;
    }
    .footer-content {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .footer-logo {
      max-height: 40px;
      width: auto;
    }
    .footer-text {
      font-family: Arial, sans-serif;
      font-size: 14px;
    }
  </style>
  <body>
    <!-- HEADER -->  
    <header>
      <div>
        <nav class="navbar">
          <div class="brand">
            <div class="brand-top">
              <img loading="lazy" src="https://app.proofeasy.io/proxy/image/dmVyaWZpY2F0aW9uX3dlYnNpdGUvSU1HXzE3ODg0MDE1NTZfODAwMjAwLW1zdGxvZ28ucG5n?uid=333" alt="logo" >
            </div>
          </div>
        </nav>
      </div>
    </header>
    <!-- MIDDLE CONTENT -->  
    <iframe id="iframeCode" class="doc-frame" src="https://app.proofeasy.io/final_doc/944ea690-8aa3-4b24-981c-926684fadb94.pdf?type=iframe" scrolling="no" allow="clipboard-write"></iframe>
    <script>
      const iframe = document.getElementById("iframeCode");
      let resizedByMessage = false;
      // Listen event message from iframe
      window.addEventListener("message", function(event) {
        // For security, filter message origin
        if (event.origin !== "https://app.proofeasy.io") return;

        if (event.data.iframeHeight) {
          console.log('height from content of iframe', event.data.iframeHeight);
          iframe.style.height = event.data.iframeHeight + "px";
          resizedByMessage = true;
        }
      });
      // Fallback: if no resize message, use default height
      iframe.addEventListener("load", function() {
        setTimeout(() => {
          if (!resizedByMessage) {
            iframe.style.height = "2700px"; // fallback
          }
        }, 2000);
      });

      const urlParams = new URLSearchParams(window.location.search);
      const file = urlParams.get('file');
      if(file){
        iframe.setAttribute("src",'https://app.proofeasy.io/final_doc/'+file+'?type=iframe');
      }
    </script>
